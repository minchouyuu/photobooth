<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>photobooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:ital,wght@0,500;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Decor nằm phía sau nội dung -->
  <div class="decor" aria-hidden="true">
    <img data-d="nơ 3.png"   class="keep" style="left:3%;top:16%;width:64px;--r:-14deg">
    <img data-d="nơ 1.png"   class="keep" style="right:4%;top:9%;width:96px;--r:9deg">
    <img data-d="sao 1.png"  class="keep" style="left:7%;bottom:13%;width:46px;--r:12deg">
    <img data-d="sao 2.png"  style="right:6%;bottom:24%;width:40px;--r:-10deg">
    <img data-d="nhạc 2.png" class="keep" style="right:3%;top:42%;width:38px;--r:14deg">
    <img data-d="nhạc 5.png" style="left:2.5%;top:54%;width:34px;--r:-12deg">
    <img data-d="nhạc 3.png" style="right:9%;bottom:6%;width:56px;--r:-8deg">
    <img data-d="nhạc 1.png" style="left:11%;top:6%;width:44px;--r:10deg">
    <img data-d="thỏ 3.png"  style="left:5%;bottom:3%;width:78px;--r:-4deg">
    <img data-d="thỏ 6.png"  style="right:2%;bottom:3%;width:64px;--r:5deg">
  </div>

  <header>
    <div class="lace lace-top"></div>
    <h1>photobooth</h1>
    <ol class="steps" id="steps">
      <li class="on" data-step="1">Chụp</li>
      <li data-step="2">Chọn ảnh</li>
      <li data-step="3">Chọn frame</li>
      <li data-step="4">Filter</li>
    </ol>
  </header>

  <main>
    <!-- BƯỚC 1: CHỤP HOẶC TẢI ẢNH -->
    <section id="s1" class="capture portrait-mode">
      <div class="camwrap">
        <div class="cam">
          <video id="vid" class="flip" playsinline muted></video>
          <canvas id="camOverlay" class="cam-overlay" aria-hidden="true"></canvas>
          <div id="slotBadge" class="slot-badge" hidden>Ô 1/4</div>
          <div id="camEmpty" class="cam-empty">
            <span>Chưa bật camera</span>
            <small>Bấm “Bật camera” hoặc tải ảnh có sẵn lên nhé</small>
          </div>
          <div id="cd" class="count" aria-live="assertive"></div>
          <div id="flash"></div>
        </div>
        <img class="pin" data-d="nơ 2.png" alt="">
      </div>

      <div class="card side">
        <div class="card-head">
          <h2>Chọn frame & Chụp</h2>
          <div class="timer-pill" role="group" aria-label="Thời gian đếm ngược">
            <button type="button" class="t-btn" data-sec="3">3s</button>
            <button type="button" class="t-btn" data-sec="5" aria-pressed="true">5s</button>
            <button type="button" class="t-btn" data-sec="8">8s</button>
          </div>
        </div>
        <p id="msg">Chọn mẫu frame bạn thích rồi bật camera nhé.</p>

        <!-- Chọn trước Frame ngay từ bước 1 -->
        <div class="pre-frames" id="preFrames" aria-label="Chọn mẫu frame trước khi chụp"></div>

        <ol class="rolls" id="rolls"></ol>

        <div class="toggles">
          <label class="check"><input type="checkbox" id="mirror" checked> Lật gương</label>
          <label class="check"><input type="checkbox" id="showFrameCam" checked> Hiện frame lên camera</label>
        </div>

        <div class="actions">
          <button id="go" class="primary">Bật camera</button>
          <button id="stop" class="ghost" hidden>Dừng</button>
          <label class="ghost upload-btn" title="Chọn tối đa 6 ảnh từ thiết bị">
            Tải ảnh lên
            <input type="file" id="uploadInput" accept="image/*" multiple hidden>
          </label>
        </div>
      </div>
    </section>

    <!-- BƯỚC 2–4: CHỌN ẢNH / FRAME / FILTER -->
    <section id="editor" class="editor portrait-mode" hidden>
      <div class="sheet">
        <canvas id="cv" aria-label="Xem trước dải ảnh"></canvas>
        <img class="pin" data-d="nơ 3.png" alt="">
      </div>

      <div class="card panel">
        <div id="p2">
          <div class="card-head">
            <h2>Chọn ảnh</h2>
            <div class="quick-picks">
              <button type="button" id="autoPick" class="mini-btn">Chọn nhanh</button>
              <button type="button" id="clearPick" class="mini-btn">Bỏ chọn</button>
            </div>
          </div>
          <p class="hint" id="hint2"></p>
          <div class="picks" id="picks"></div>
        </div>

        <div id="p3" hidden>
          <h2>Chọn frame</h2>
          <div class="frames" id="frames"></div>
          <p class="hint" id="hint3"></p>
        </div>

        <div id="p4" hidden>
          <h2>Chọn filter</h2>
          <div class="chips" id="chips"></div>
        </div>

        <div class="actions">
          <button id="back" class="ghost">Chụp lại</button>
          <button id="next" class="primary">Tiếp tục</button>
          <button id="again" class="link" hidden>Chụp lại từ đầu</button>
        </div>
      </div>
    </section>
  </main>

  <div class="lace lace-bottom" aria-hidden="true"></div>
  <p id="toast" role="status"></p>
  <script src="script.js"></script>
</body>
</html>
